<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it, the iPhone home bar eats the bottom of the page,
         and env(safe-area-inset-bottom) is zero in the stylesheets.

         interactive-widget=resizes-content: Chromium shrinks the LAYOUT viewport when the
         virtual keyboard opens, which is what makes `fixed inset-0` and svh mean "above the
         keyboard" there for free. Safari does not implement it, hence the visualViewport
         effect in components/terminal.tsx - this attribute costs nothing and spares Android
         from depending on it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The mark, for one tab among twenty. Inline, because one more file served by Caddy
         for sixteen pixels is not worth it. Written here by brand/build.ts, along with
         components/logo.tsx: a favicon copied by hand is a favicon that drifts, and a tab
         disagreeing with the page it opens reports to no one. -->
